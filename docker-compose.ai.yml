services:
  # ──────────────────────────────────────────────────────
  # Qdrant (Vector DB)
  # ──────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.13.0
    container_name: skinaid_qdrant
    restart: always
    volumes:
      - qdrant_data:/qdrant/storage
    # Mở port ra host để Backend-EC2 gọi sang
    ports:
      - "6333:6333"
      - "6334:6334"
    networks:
      - skinaid_ai_net
    healthcheck:
      test: ["CMD-SHELL", "grep -q '18BD' /proc/net/tcp || grep -q '18BD' /proc/net/tcp6 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────────────
  # AI Service
  # ──────────────────────────────────────────────────────
  ai_ml:
    build:
      context: ./ai_ml
      dockerfile: Dockerfile
    image: skinaid-ai:latest
    container_name: skinaid_ai
    restart: always
    env_file:
      - ./ai_ml/.env
    # Mở port 8001 ra host để Backend-EC2 gọi sang
    ports:
      - "8001:8001"
      - "5000:5000"
    volumes:
      - ai_model_weights:/app/models
    networks:
      - skinaid_ai_net

networks:
  skinaid_ai_net:
    driver: bridge

volumes:
  qdrant_data:
  ai_model_weights:
